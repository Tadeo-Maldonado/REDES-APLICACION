# Inventario PREDEFINIDO de switches. La aplicación solo se conecta a estos
# equipos; NO lanza escaneos de red.
# Copia este archivo como switches.yaml (está en .gitignore).
# Las contraseñas NO van aquí: se leen de variables de entorno (.env).

switches:
  - name: SW-CORE-01
    host: 10.0.0.1
    vendor: cisco          # cisco | aruba | alcatel
    username_env: SW_USER  # nombre de la variable de entorno con el usuario
    password_env: SW_PASS  # nombre de la variable de entorno con la contraseña

  - name: SW-ACCESO-01
    host: 10.0.0.2
    vendor: aruba
    username_env: SW_USER
    password_env: SW_PASS

  - name: SW-ACCESO-02
    host: 10.0.0.3
    vendor: alcatel
    username_env: SW_USER
    password_env: SW_PASS
